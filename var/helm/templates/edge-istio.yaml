{{- if eq .Values.edge.kind "istio" }}
{{/*---*/}}
{{/*apiVersion: gateway.networking.k8s.io/v1*/}}
{{/*kind: Gateway*/}}
{{/*metadata:*/}}
{{/*  name: waypoint*/}}
{{/*  labels:*/}}
{{/*    app.kubernetes.io/name: waypoint*/}}
{{/*    {{ include "common.labels" . | nindent 4 }}*/}}
{{/*spec:*/}}
{{/*  gatewayClassName: istio-waypoint*/}}
{{/*  listeners:*/}}
{{/*  - name: mesh*/}}
{{/*    port: 15008*/}}
{{/*    protocol: HBONE*/}}
---
apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: gw
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: gw
    {{ include "common.labels" . | nindent 4 }}
spec:
  selector:
    app: mpafastapi
  servers:
  - port:
      number: 80
      name: http
      protocol: HTTP
    hosts:
    - {{ .Values.ingress.hostname }}.{{ .Values.cluster.name }}.{{ .Values.cluster.domain }}
    tls:
      httpsRedirect: false
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: vs
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: vs
    {{ include "common.labels" . | nindent 4 }}
spec:
  hosts:
  - {{ .Values.ingress.hostname }}.{{ .Values.cluster.name }}.{{ .Values.cluster.domain }}
  gateways:
  - gw
  http:
  - name: "mpafastapi"
    route:
    - destination:
        host: svc-mpafastapi.{{ .Release.Namespace }}.svc.cluster.local
{{- end }}
